server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загружаемые статьи могут быть крупными (см. max_upload_size = 10 МБ).
    client_max_body_size 20m;

    # Редиректы отдаём относительными путями. С absolute_redirect on (по
    # умолчанию) nginx подставил бы схему и хост от себя — за внешним прокси
    # это увело бы посетителя с https на http, а при доступе по нестандартному
    # порту потеряло бы сам порт.
    absolute_redirect off;

    # Проксируем API на бэкенд FastAPI. Фронт обращается по baseURL "/api",
    # префикс срезаем — как Vite-прокси в деве.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ассеты SPA собраны с хешем в имени и неизменны — кешируем надолго.
    # Правило идёт до location /app/, поэтому объявлено с ^~ ... (regex
    # проверяется раньше префиксов, так что достаточно обычного location).
    location ~* ^/app/assets/.*\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML никогда не кешируем надолго: иначе после выката браузер продолжает
    # отдавать старую страницу из кеша (со старым SPA в корне — вплоть до
    # редиректа на несуществующий /login). Ассеты выше кешируются вечно, и это
    # безопасно: их имена содержат хеш содержимого.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Пути приложения до переезда на /app/ — у пользователей могли остаться
    # закладки и открытые вкладки. Отдаём постоянный редирект вместо 404.
    location ~ ^/(login|register|articles|users|roles|permissions|profile)(/.*)?$ {
        return 301 /app$request_uri;
    }

    # SPA: React Router работает с basename="/app", поэтому все неизвестные
    # пути внутри /app/ отдаём в его index.html — иначе F5 на /app/articles
    # вернул бы 404.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Корень — статический сайт конференции (frontend/site). Никакого
    # SPA-fallback здесь быть не должно: несуществующая страница обязана
    # отдавать 404, а не подсовывать приложение вместо сайта.
    location / {
        try_files $uri $uri/ =404;
    }
}
