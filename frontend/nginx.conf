# Адреса старого сайта → новые маршруты. Ссылки на страницы конференции
# разошлись по печатным материалам, письмам и поисковой выдаче, поэтому ни
# один старый адрес не должен отдавать 404.
map $uri $legacy_path {
    default                    "";

    /index.html                /;
    /umumiy.html               /about;
    /risola.html               /about/brochure;
    /conference.html           /about/conferences;
    /about.html                /about;

    /zarafshon.html            /region/zarafshon;
    /alisher_navoiy.html       /region/alisher-navoiy;
    /samarqand.html            /region/samarqand;
    /buxoro.html               /region/buxoro;
    /navoiy.html               /region/navoiy;
    /nurota.html               /region/nurota;
    /sarmish.html              /region/sarmish;

    /foydali_qazilma.html      /sections/mining;
    /mashina.html              /sections/machinery;
    /kimyo.html                /sections/chemistry;
    /energy.html               /sections/energy;
    /qishloq.html              /sections/agriculture;

    /dk.html                   /partners/nkmk;
    /aj.html                   /partners/navoiyazot;
    /eiiz.html                 /partners/feiz;
    /issiqlik.html             /partners/tes;

    /muhim_sanalar.html        /dates;
    /tezis.html                /submission;
    /contact.html              /contacts;
    /account.html              /app/login;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загружаемые статьи могут быть крупными (см. max_upload_size = 10 МБ).
    client_max_body_size 20m;

    # Редиректы отдаём относительными путями. С absolute_redirect on (по
    # умолчанию) nginx подставил бы схему и хост от себя — за внешним прокси
    # это увело бы посетителя с https на http, а при доступе по нестандартному
    # порту потеряло бы сам порт.
    absolute_redirect off;

    # Единственное применение if в конфиге — постоянный редирект, для него
    # это безопасно (см. «if is evil», return входит в разрешённый список).
    if ($legacy_path != "") {
        return 301 $legacy_path;
    }

    # Пути кабинета до переезда под /app.
    location ~ ^/(login|register|articles|users|roles|permissions|profile)(/.*)?$ {
        return 301 /app$request_uri;
    }

    # Проксируем API на бэкенд FastAPI. Фронт обращается по baseURL "/api",
    # префикс срезаем — как Vite-прокси в деве.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ассеты собраны с хешем в имени и неизменны — кешируем надолго.
    location ~* ^/assets/.*\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Картинки сайта имя не меняют, поэтому кешируем умеренно.
    location ^~ /media/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML никогда не кешируем надолго: иначе после выката браузер продолжает
    # отдавать старую страницу из кеша.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Единый SPA-бандл в корне: сайт конференции на /, кабинет на /app/.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
