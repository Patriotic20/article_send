server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загружаемые статьи могут быть крупными (см. max_upload_size = 10 МБ).
    client_max_body_size 20m;

    # Проксируем API на бэкенд FastAPI. Фронт обращается по baseURL "/api",
    # префикс срезаем — как Vite-прокси в деве.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-роутинг: всё неизвестное отдаём в index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
