# Хостовый nginx для idz.nsumt.uz.
#
# Схема: браузер -> этот nginx (80/443, TLS) -> контейнер frontend на
# 127.0.0.1:${FRONTEND_PORT} -> внутри контейнера SPA-fallback и /api/ на backend.
# Вся логика приложения остаётся в frontend/nginx.conf; здесь только TLS,
# сжатие и проксирование.
#
# Установка зависит от того, как поставлен nginx.
#
# Пакет Debian/Ubuntu (есть каталог /etc/nginx/sites-available):
#   sudo cp deploy/nginx/idz.nsumt.uz.conf /etc/nginx/sites-available/idz.nsumt.uz
#   sudo ln -s /etc/nginx/sites-available/idz.nsumt.uz /etc/nginx/sites-enabled/
#
# Сборка с nginx.org (каталогов sites-* нет, только conf.d):
#   sudo cp deploy/nginx/idz.nsumt.uz.conf /etc/nginx/conf.d/idz.nsumt.uz.conf
#
# В обоих случаях затем:
#   sudo nginx -t && sudo systemctl reload nginx
# Затем выпустить сертификат:
#   sudo certbot --nginx -d idz.nsumt.uz
# Certbot сам допишет server-блок на 443 и редирект с 80. Готовый вид этого
# блока — в deploy/README.md, если конфигурировать TLS вручную.

# Схема, которую видел браузер.
#
# Если этот nginx — единственный внешний вход, $scheme и есть настоящая схема.
# Если перед ним стоит ещё один reverse proxy (балансировщик вуза, Cloudflare),
# TLS терминируется ТАМ, а к нам запрос приходит по http — тогда $scheme врёт,
# и полагаться нужно на X-Forwarded-Proto от вышестоящего прокси.
# map покрывает оба случая: заголовок есть — берём его, нет — берём $scheme.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https   https;
    http    http;
}

# Общие параметры проксирования к контейнеру фронта.
upstream article_send_frontend {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name idz.nsumt.uz;

    # ЕСЛИ перед этим сервером стоит другой reverse proxy — раскомментировать
    # и подставить его адрес. Без этого в логах и в X-Forwarded-For, который
    # уходит в контейнер, будет IP прокси, а не посетителя: разбирать инциденты
    # и ограничивать частоту запросов станет невозможно.
    # Доверять заголовку можно ТОЛЬКО от известного адреса — иначе любой
    # клиент подделает свой IP, просто прислав X-Forwarded-For.
    # set_real_ip_from  10.0.0.0/8;      # адрес/подсеть вышестоящего прокси
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # Проверка домена для Let's Encrypt. Префикс ^~ обязателен: он отключает
    # проверку regex-локаций и гарантирует, что ACME-запрос не уйдёт в
    # "location /" и не будет проксирован в контейнер. Иначе SPA-fallback
    # внутри контейнера отдаст на challenge index.html с кодом 200, и Let's
    # Encrypt отклонит валидацию ("Invalid response ... <!doctype html>") —
    # ошибка тем неприятнее, что выглядит как «сервер отвечает, но не тем».
    # try_files ... =404 отдаёт честный 404 на несуществующий токен.
    # Максимальный размер загружаемой статьи. Бэкенд ограничивает 10 МБ
    # (max_upload_size), внутренний nginx — 20m; хостовый должен быть не меньше,
    # иначе запрос обрывается с 413 ещё до бэкенда.
    client_max_body_size 20m;

    # Сжатие проксируемых ответов: в образе nginx:alpine gzip выключен,
    # поэтому включаем здесь.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /var/log/nginx/idz.nsumt.uz.access.log;
    error_log  /var/log/nginx/idz.nsumt.uz.error.log;

    location / {
        proxy_pass http://article_send_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Схема, которую видел браузер. Без неё бэкенд за TLS считает запрос
        # http-шным и может отдать ссылки, заблокированные как mixed content.
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Загрузка и конвертация файлов статей дольше дефолтных 60 секунд.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Тело запроса не буферизуем на диск: загрузки идут потоком к бэкенду.
        proxy_request_buffering off;
    }
}
