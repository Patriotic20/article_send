# Хостовый nginx этой VM. Только HTTP (порт 80) — и это осознанно.
#
# Схема:
#   браузер --HTTPS--> внешний reverse proxy (37.153.159.11, домен idz.nsumt.uz,
#                      там же терминируется TLS)
#           --HTTP---> эта VM (195.158.27.186:80) -- этот конфиг
#           ---------> контейнер frontend на 127.0.0.1:${FRONTEND_PORT}
#                      -- SPA-fallback и /api/ на backend (frontend/nginx.conf)
#
# Отсюда три следствия, заложенные ниже:
#   1. Сертификат в VM не нужен: наружу TLS отдаёт внешний прокси.
#   2. Никаких "return 301 https://" здесь быть не должно. Прокси ходит к нам по
#      http, и безусловный редирект на https зациклит запрос.
#   3. Реальную схему и IP посетителя знает только прокси — берём их из
#      заголовков X-Forwarded-* (см. map ниже и set_real_ip_from).
#
# ВАЖНО: порт в upstream ниже должен совпадать с FRONTEND_PORT из .env,
# иначе nginx вернёт 502.
#
# Установка зависит от того, как поставлен nginx.
#
# Пакет Debian/Ubuntu (есть каталог /etc/nginx/sites-available):
#   sudo cp deploy/nginx/idz.nsumt.uz.conf /etc/nginx/sites-available/idz.nsumt.uz
#   sudo ln -s /etc/nginx/sites-available/idz.nsumt.uz /etc/nginx/sites-enabled/
#
# Сборка с nginx.org (каталогов sites-* нет, только conf.d):
#   sudo cp deploy/nginx/idz.nsumt.uz.conf /etc/nginx/conf.d/idz.nsumt.uz.conf
#
# В обоих случаях затем:
#   sudo nginx -t && sudo systemctl reload nginx

# Схема, которую видел браузер.
#
# Если этот nginx — единственный внешний вход, $scheme и есть настоящая схема.
# Если перед ним стоит ещё один reverse proxy (балансировщик вуза, Cloudflare),
# TLS терминируется ТАМ, а к нам запрос приходит по http — тогда $scheme врёт,
# и полагаться нужно на X-Forwarded-Proto от вышестоящего прокси.
# map покрывает оба случая: заголовок есть — берём его, нет — берём $scheme.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https   https;
    http    http;
}

# Общие параметры проксирования к контейнеру фронта.
upstream article_send_frontend {
    server 127.0.0.1:8080;   # = FRONTEND_PORT из .env
    keepalive 16;
}

server {
    # default_server: внешний прокси не обязан передавать Host: idz.nsumt.uz —
    # он может обратиться и по IP. Этот блок в VM единственный, поэтому пусть
    # обрабатывает любой Host, а не только совпавший с server_name.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name idz.nsumt.uz 195.158.27.186 _;

    # Настоящий IP посетителя приходит в X-Forwarded-For от внешнего прокси:
    # без этих трёх строк во всех логах стоял бы один и тот же адрес прокси.
    # Доверять заголовку можно ТОЛЬКО с известного адреса — иначе любой клиент
    # подделает свой IP, просто прислав X-Forwarded-For сам.
    set_real_ip_from  37.153.159.11;   # внешний reverse proxy (A-запись домена)
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Максимальный размер загружаемой статьи. Бэкенд ограничивает 10 МБ
    # (max_upload_size), внутренний nginx — 20m; хостовый должен быть не меньше,
    # иначе запрос обрывается с 413 ещё до бэкенда.
    client_max_body_size 20m;

    # Сжатие проксируемых ответов: в образе nginx:alpine gzip выключен,
    # поэтому включаем здесь.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /var/log/nginx/idz.nsumt.uz.access.log;
    error_log  /var/log/nginx/idz.nsumt.uz.error.log;

    location / {
        proxy_pass http://article_send_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Схема, которую видел браузер. Без неё бэкенд за TLS считает запрос
        # http-шным и может отдать ссылки, заблокированные как mixed content.
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Загрузка и конвертация файлов статей дольше дефолтных 60 секунд.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Тело запроса не буферизуем на диск: загрузки идут потоком к бэкенду.
        proxy_request_buffering off;
    }
}
