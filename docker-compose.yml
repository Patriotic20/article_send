services:
  db:
    image: postgres:17-alpine
    container_name: article_send_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-article}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-article}
      POSTGRES_DB: ${POSTGRES_DB:-article_send}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-article} -d ${POSTGRES_DB:-article_send}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: article_send_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Внутри сети compose обращаемся к db по имени сервиса на 5432.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://article:article@db:5432/article_send}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    volumes:
      # Загруженные файлы статей храним на хосте (bind-mount), не в томе Docker —
      # внутри по подпапкам-годам: ./uploads/<год>/<uuid>.ext.
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: article_send_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
