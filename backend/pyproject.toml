[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    # passlib 1.7.4 несовместим с bcrypt>=4.1 (ошибка self-теста бэкенда),
    # поэтому фиксируем последнюю рабочую версию.
    "bcrypt==4.0.1",
    # Прод-запуск: gunicorn управляет процессами, uvicorn-воркеры держат ASGI.
    # uvicorn>=0.30 убрал uvicorn.workers — класс теперь в пакете uvicorn-worker.
    "gunicorn>=23.0.0",
    "uvicorn-worker>=0.3.0",
    # Миграции схемы БД (async-движок на asyncpg).
    "alembic>=1.13.0",
]
