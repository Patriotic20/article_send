services:
  db:
    image: postgres:17-alpine
    container_name: article_send_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-article}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-article}
      POSTGRES_DB: ${POSTGRES_DB:-article_send}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-article} -d ${POSTGRES_DB:-article_send}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
